[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnikey"
version = "0.1.0"
description = "Dynamic Keybinding & Context Tracker Agent for Herdr, Neovim, Tmux, and Zsh"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Halis Yılboğa", email = "halis65@gmail.com" }
]
dependencies = [
    "watchdog>=3.0.0",
]

[project.scripts]
omnikey = "omnikey.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnikey*"]
